<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Pipeline — Papers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Georgia, 'Times New Roman', serif; background: #faf9f7; color: #1a1a1a; max-width: 860px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 1.8em; border-bottom: 3px solid #1a73e8; padding-bottom: 8px; margin-bottom: 24px; }
    .paper-list { list-style: none; }
    .paper-item { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px 20px; margin-bottom: 12px; cursor: pointer; transition: box-shadow 0.15s; }
    .paper-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .paper-item .title { font-weight: 600; font-size: 1.1em; color: #1a73e8; }
    .paper-item .meta { font-size: 0.85em; color: #777; margin-top: 4px; }
    .paper-item .badge { display: inline-block; background: #e8f5e9; color: #2e7d32; font-size: 0.75em; padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
    .paper-item .badge.warn, .warn-banner { background: #fff3e0; color: #e65100; }
    .warn-banner { border: 1px solid #ffcc80; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 0.88em; }
    #viewer { display: none; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 32px; margin-top: 16px; }
    #viewer.open { display: block; }
    #viewer .back { display: inline-block; margin-bottom: 16px; color: #1a73e8; cursor: pointer; font-size: 0.9em; }
    #viewer .back:hover { text-decoration: underline; }
    #viewer h1 { font-size: 1.4em; border: none; margin-bottom: 16px; }
    #viewer h2 { font-size: 1.2em; margin: 20px 0 10px; color: #333; }
    #viewer h3 { font-size: 1.05em; margin: 16px 0 8px; color: #444; }
    #viewer p { line-height: 1.7; margin-bottom: 12px; }
    #viewer blockquote { border-left: 3px solid #1a73e8; padding-left: 16px; margin: 16px 0; color: #555; font-style: italic; }
    #viewer table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.9em; }
    #viewer th, #viewer td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; }
    #viewer th { background: #f5f5f5; }
    #viewer code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; font-size: 0.9em; }
    #viewer pre { background: #f5f5f5; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 12px 0; }
    #viewer pre code { background: none; padding: 0; }
    #viewer ul, #viewer ol { margin: 8px 0 12px 24px; }
    #viewer li { margin-bottom: 4px; line-height: 1.6; }
    #viewer strong { color: #222; }
    #viewer figure { margin: 20px 0; text-align: center; }
    #viewer figure img { max-width: 100%; border: 1px solid #e0e0e0; border-radius: 6px; }
    #viewer figcaption { font-size: 0.82em; color: #777; margin-top: 8px; font-style: italic; }
    #viewer hr { border: none; border-top: 1px solid #ddd; margin: 20px 0; }
    .empty { color: #999; font-style: italic; padding: 40px 0; text-align: center; }
    .loading { color: #999; text-align: center; padding: 40px 0; }
    #status { font-size: 0.85em; color: #999; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>📄 Academic Pipeline</h1>
  <div id="status">Cargando papers...</div>
  <ul class="paper-list" id="list"></ul>
  <div id="viewer"><span class="back" onclick="closePaper()">← Volver a la lista</span><div id="content"></div></div>

  <script>
    const list = document.getElementById('list');
    const viewer = document.getElementById('viewer');
    const content = document.getElementById('content');
    const status = document.getElementById('status');
    let papersData = [];

    async function init() {
      try {
        const res = await fetch('index.json');
        if (!res.ok) throw new Error('index.json not found');
        const papers = await res.json();
        renderList(papers);
      } catch {
        status.textContent = '';
        list.innerHTML = '<p class="empty">No hay papers aún. El pipeline corre diariamente a las 8am.</p>';
      }
    }

    function renderList(papers) {
      status.textContent = `${papers.length} paper(s) generado(s)`;
      if (!papers.length) {
        list.innerHTML = '<p class="empty">No hay papers aún.</p>';
        return;
      }
      // Sort newest first
      papers.sort((a, b) => b.date.localeCompare(a.date));
      papersData = papers;
      list.innerHTML = papers.map((p, i) => `
        <li class="paper-item" onclick="openPaper(${i})">
          <div class="title">${esc(p.topic || p.file)}</div>
          <div class="meta">
            ${p.date} · ${p.nodes || ''} nodos
            ${p.warning ? '<span class="badge warn">⚠ No verificado</span>' : '<span class="badge">Auto</span>'}
          </div>
        </li>
      `).join('');
    }

    async function openPaper(idx) {
      const p = papersData[idx];
      try {
        const res = await fetch(`papers/${p.file}`);
        if (!res.ok) throw new Error('not found');
        const md = await res.text();
        const banner = p.warning ? `<div class="warn-banner">⚠ ${esc(p.warning)}</div>` : '';
        content.innerHTML = banner + renderMd(md);
        list.style.display = 'none';
        status.style.display = 'none';
        viewer.classList.add('open');
        window.scrollTo(0, 0);
      } catch {
        content.innerHTML = '<p class="empty">No se pudo cargar el paper.</p>';
        viewer.classList.add('open');
      }
    }

    function closePaper() {
      viewer.classList.remove('open');
      list.style.display = '';
      status.style.display = '';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    // Markdown renderer: tables, images, lists, headers, blockquotes
    function renderMd(md) {
      // Normalizar: LaTeX delimiters a texto plano visible
      md = md.replace(/\\\[([\s\S]*?)\\\]/g, '`$1`').replace(/\\\(([\s\S]*?)\\\)/g, '`$1`');
      const lines = md.split('\n');
      let html = '';
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        // Tabla markdown: | a | b |\n|---|---|
        if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s\-:|]+\|\s*$/.test(lines[i + 1])) {
          const headers = line.split('|').slice(1, -1).map(c => c.trim());
          i += 2;
          const rows = [];
          while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
            rows.push(lines[i].split('|').slice(1, -1).map(c => c.trim()));
            i++;
          }
          html += '<table><thead><tr>' + headers.map(h => `<th>${inline(h)}</th>`).join('') + '</tr></thead><tbody>'
            + rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('')
            + '</tbody></table>';
          continue;
        }
        // Imagen
        const imgMatch = line.match(/^\s*!\[([^\]]*)\]\(([^)]+)\)/);
        if (imgMatch) {
          let src = imgMatch[2];
          // charts/x.png referenciado desde paper en papers/ → ../charts/x.png relativo a index.html queda charts/x.png
          html += `<figure><img src="${src}" alt="${imgMatch[1]}" loading="lazy"><figcaption>${imgMatch[1]}</figcaption></figure>`;
          i++; continue;
        }
        // Headers
        const h = line.match(/^(#{1,4})\s+(.+)$/);
        if (h) { html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; i++; continue; }
        // HR
        if (/^\s*-{3,}\s*$/.test(line)) { html += '<hr>'; i++; continue; }
        // Blockquote
        if (/^\s*>\s?/.test(line)) {
          const quote = [];
          while (i < lines.length && /^\s*>\s?/.test(lines[i])) { quote.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
          html += `<blockquote>${quote.map(inline).join('<br>')}</blockquote>`;
          continue;
        }
        // Lista con bullets
        if (/^\s*[-*]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, '')); i++; }
          html += '<ul>' + items.map(it => `<li>${inline(it)}</li>`).join('') + '</ul>';
          continue;
        }
        // Lista numerada
        if (/^\s*\d+[.)]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*\d+[.)]\s+/, '')); i++; }
          html += '<ol>' + items.map(it => `<li>${inline(it)}</li>`).join('') + '</ol>';
          continue;
        }
        // Párrafo
        if (line.trim()) {
          const para = [line];
          while (i + 1 < lines.length && lines[i + 1].trim() && !/^\s*([#>|`-]|\d+[.)])/.test(lines[i + 1]) && !/!\[/.test(lines[i + 1])) {
            i++;
            para.push(lines[i]);
          }
          html += `<p>${para.map(inline).join('<br>')}</p>`;
          i++; continue;
        }
        i++;
      }
      return html;
    }

    function inline(t) {
      return esc(t)
        .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    }

    init();
  </script>
</body>
</html>
