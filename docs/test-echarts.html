<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ECharts test</title>
<style>.echart{width:760px;height:380px;margin:24px auto;border:1px solid #eee}</style>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head><body>
<div id="app"></div>
<script src="test-frag.js"></script>
<script>
fetch('charts/test-echarts/data.json').then(r=>r.json()).then(async d=>{
  for(const [fname,f] of Object.entries(d.figures)){
    let opt = null;
    if(f.type==='bars' && f.items.length>=3 && await getWorldGeo()) opt = buildMapOption(f);
    if(!opt) opt = buildChartOption(f);
    if(!opt) continue;
    const div=document.createElement('div');div.className='echart';
    if(f.type==='forest')div.style.height=Math.max(180,f.entries.length*38+90)+'px';
    if(f.type==='heatmap')div.style.height=Math.max(220,f.pairs.length*36+120)+'px';
    if(f.type==='panels'){const rows=Math.ceil(f.panels.length/3);div.style.height=Math.max(240,rows*190+40)+'px';}
    document.getElementById('app').appendChild(div);
    echarts.init(div).setOption(opt);
  }
  document.title='RENDERED';
});
</script>
</body></html>
