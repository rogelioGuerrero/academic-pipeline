name: Daily Research Pipeline

on:
  schedule:
    # 8am GMT-6 = 14:00 UTC — runs after job-hunter's 7am run
    - cron: '0 14 * * *'
  workflow_dispatch: {}
  repository_dispatch:
    types: [news-ready]

permissions:
  contents: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install numpy scipy

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Fetch news_found.json from job-hunter
        run: |
          mkdir -p ../job-hunter
          # job-hunter is private — use PAT to fetch via GitHub API
          curl -sL -H "Authorization: token ${{ secrets.JOB_HUNTER_PAT }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/rogelioGuerrero/job-hunter/contents/news_found.json" \
            -o ../job-hunter/news_found.json
          if python -c "import json; json.load(open('../job-hunter/news_found.json'))" 2>/dev/null; then
            echo "news_found.json OK"
          else
            echo "Failed to fetch news_found.json — continuing without news"
          fi
        continue-on-error: true

      - name: Restore fetch cache
        uses: actions/cache@v5
        with:
          path: output/raw/fetched-data.json
          key: fetch-cache-${{ hashFiles('scripts/fetch-sources.mjs') }}
          restore-keys: |
            fetch-cache-

      - name: Run research pipeline
        run: node scripts/research.mjs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/briefs/ output/papers/ output/raw/compute-results.json 2>/dev/null || true
          git commit -m "Daily research paper - $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: research-${{ github.run_id }}
          path: |
            output/briefs/
            output/papers/
            output/raw/compute-results.json
          retention-days: 30
