name: Daily Research Pipeline

on:
  schedule:
    # 8am GMT-6 = 14:00 UTC — runs after job-hunter's 7am run
    - cron: '0 14 * * *'
  workflow_dispatch: {}
  repository_dispatch:
    types: [news-ready]

permissions:
  contents: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install numpy scipy matplotlib

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Fetch news_found.json from job-hunter
        run: |
          mkdir -p ../job-hunter
          # news_found.json nunca se commitea a job-hunter (solo se deploya a Netlify).
          # Se baja del dashboard publico de Netlify, que se actualiza en cada run de job-hunter.
          curl -sL --fail \
            "https://job-hunter-dashboard.netlify.app/news_found.json" \
            -o ../job-hunter/news_found.json
          if python -c "import json; d=json.load(open('../job-hunter/news_found.json')); assert isinstance(d, list)" 2>/dev/null; then
            echo "news_found.json OK ($(python -c "import json; print(len(json.load(open('../job-hunter/news_found.json'))))") articulos)"
          else
            echo "news_found.json invalido o no es una lista. Continuando sin noticias."
            echo "[]" > ../job-hunter/news_found.json
          fi
        continue-on-error: true

      - name: Run research pipeline
        run: node scripts/research.mjs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Copy papers to docs/ for GitHub Pages
        run: |
          mkdir -p docs/papers docs/charts
          for f in output/papers/*.md; do
            [ -f "$f" ] && cp "$f" "docs/papers/$(basename $f)"
          done
          for f in output/charts/*.png; do
            [ -f "$f" ] && cp "$f" "docs/charts/$(basename $f)"
          done
          # Generate index.json listing all papers
          python -c "
            import json, os, glob
            papers = []
            for f in sorted(glob.glob('docs/papers/*.md'), reverse=True):
                name = os.path.basename(f)
                date = name[:10] if len(name) > 10 else ''
                topic = 'Paper'
                verified = False
                try:
                    with open(f, encoding='utf-8') as fh:
                        content = fh.read()
                        verified = '## Nota de transparencia' in content
                        for line in content.splitlines():
                            if line.startswith('# '):
                                topic = line[2:].strip(); break
                except: pass
                entry = {'file': name, 'date': date, 'topic': topic, 'nodes': 7, 'mode': 'suggest'}
                # Veredictos + noticia inspiradora desde la metadata (output/papers/<stem>.json)
                meta_path = os.path.join('output/papers', os.path.splitext(name)[0] + '.json')
                try:
                    meta = json.load(open(meta_path, encoding='utf-8'))
                    if meta.get('reviewDecision', {}).get('veredicto'):
                        entry['review'] = meta['reviewDecision']['veredicto']
                    if meta.get('qaDecision', {}).get('veredicto'):
                        entry['qa'] = meta['qaDecision']['veredicto']
                    news = meta.get('inspiringNews') or {}
                    # Fallback: papers antiguos sin inspiringNews — matchear
                    # suggestions[0].noticia_inspiradora contra news_found.json
                    if not news.get('image'):
                        try:
                            items = json.load(open('../job-hunter/news_found.json', encoding='utf-8'))
                            wanted = (meta.get('suggestions') or [{}])[0].get('noticia_inspiradora', '').lower()
                            for it in items:
                                t = (it.get('title') or '').lower()
                                if wanted and (wanted in t or t in wanted):
                                    news = {'image': it.get('url_to_image') or it.get('pexels_image'), 'section': it.get('section'), 'url': it.get('url')}
                                    break
                        except: pass
                    if news.get('image'):
                        entry['image'] = news['image']
                    if news.get('section'):
                        entry['section'] = news['section']
                    if news.get('url'):
                        entry['news_url'] = news['url']
                    if meta.get('pregunta'):
                        entry['pregunta'] = meta['pregunta']
                except: pass
                if not verified:
                    entry['warning'] = 'Borrador experimental generado antes de las correcciones de verificacion. Puede contener metodologia o estadisticas no verificadas.'
                papers.append(entry)
            with open('docs/index.json', 'w') as fh:
                json.dump(papers, fh, indent=2)
            print(f'index.json: {len(papers)} papers')
          "

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/briefs/ output/papers/ output/raw/compute-results.json output/raw/fetched-data.json output/charts/ docs/papers/ docs/charts/ docs/index.json 2>/dev/null || true
          git commit -m "Daily research paper - $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push

      - name: Notify new paper via Resend
        # Requiere secrets RESEND_API_KEY/RESEND_FROM/RESEND_TO y variable EMAIL_ON_PUBLISH=true
        if: ${{ vars.EMAIL_ON_PUBLISH == 'true' }}
        run: python scripts/notify-email.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_TO: ${{ secrets.RESEND_TO }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: research-${{ github.run_id }}
          path: |
            output/briefs/
            output/papers/
            output/charts/
            output/raw/compute-results.json
          retention-days: 30
