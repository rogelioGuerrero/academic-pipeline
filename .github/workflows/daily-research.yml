name: Daily Research Pipeline

on:
  schedule:
    # 8am GMT-6 = 14:00 UTC — runs after job-hunter's 7am run
    - cron: '0 14 * * *'
  workflow_dispatch: {}
  repository_dispatch:
    types: [news-ready]

permissions:
  contents: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install numpy scipy

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Fetch news_found.json from job-hunter
        run: |
          mkdir -p ../job-hunter
          # news_found.json nunca se commitea a job-hunter (solo se deploya a Netlify).
          # Se baja del dashboard publico de Netlify, que se actualiza en cada run de job-hunter.
          curl -sL --fail \
            "https://job-hunter-dashboard.netlify.app/news_found.json" \
            -o ../job-hunter/news_found.json
          if python -c "import json; d=json.load(open('../job-hunter/news_found.json')); assert isinstance(d, list)" 2>/dev/null; then
            echo "news_found.json OK ($(python -c "import json; print(len(json.load(open('../job-hunter/news_found.json'))))") articulos)"
          else
            echo "news_found.json invalido o no es una lista. Continuando sin noticias."
            echo "[]" > ../job-hunter/news_found.json
          fi
        continue-on-error: true

      - name: Run research pipeline
        run: node scripts/research.mjs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/briefs/ output/papers/ output/raw/compute-results.json output/raw/fetched-data.json 2>/dev/null || true
          git commit -m "Daily research paper - $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: research-${{ github.run_id }}
          path: |
            output/briefs/
            output/papers/
            output/raw/compute-results.json
          retention-days: 30
