name: Daily Research Pipeline

on:
  schedule:
    # 8am GMT-6 = 14:00 UTC — runs after job-hunter's 7am run
    - cron: '0 14 * * *'
  workflow_dispatch: {}
  repository_dispatch:
    types: [news-ready]

permissions:
  contents: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install numpy scipy

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Fetch news_found.json from job-hunter
        run: |
          mkdir -p ../job-hunter
          # job-hunter is private — try raw URL first, then API with GITHUB_TOKEN
          curl -sL "https://raw.githubusercontent.com/rogelioGuerrero/job-hunter/main/news_found.json" -o ../job-hunter/news_found.json
          if python -c "import json; json.load(open('../job-hunter/news_found.json'))" 2>/dev/null; then
            echo "news_found.json OK (public)"
          else
            echo "Raw fetch failed (private repo). Trying GitHub API..."
            curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/rogelioGuerrero/job-hunter/contents/news_found.json" \
              -o ../job-hunter/api-response.json
            python -c "
          import json, base64, sys
          try:
              r = json.load(open('../job-hunter/api-response.json'))
              if 'content' in r:
                  decoded = base64.b64decode(r['content']).decode('utf-8')
                  open('../job-hunter/news_found.json','w',encoding='utf-8').write(decoded)
                  print('news_found.json OK (API)')
              else:
                  print('API error:', r.get('message','unknown'))
                  sys.exit(1)
          except Exception as e:
              print('Failed:', e)
              sys.exit(1)
            "
          fi
        continue-on-error: true

      - name: Restore fetch cache
        uses: actions/cache@v5
        with:
          path: output/raw/fetched-data.json
          key: fetch-cache-${{ hashFiles('scripts/fetch-sources.mjs') }}
          restore-keys: |
            fetch-cache-

      - name: Run research pipeline
        run: node scripts/research.mjs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/briefs/ output/papers/ output/raw/compute-results.json 2>/dev/null || true
          git commit -m "Daily research paper - $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: research-${{ github.run_id }}
          path: |
            output/briefs/
            output/papers/
            output/raw/compute-results.json
          retention-days: 30
