name: Daily Research Pipeline

on:
  schedule:
    # 6am GMT-6 = 12:00 UTC — diario, antes del news run de 7am
    # Ve las 2 corridas de noticias del día anterior
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Gate de correccion estadistica: si compute.py produce numeros malos,
      # el verificador del pipeline los validaria igual (solo compara texto
      # contra resultados). Estos tests de respuesta conocida deben pasar
      # antes de gastar un solo token de Groq.
      - name: Test statistical code (compute.py)
        run: python -m pytest scripts/test_compute.py -q

      - name: Setup R & packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y r-base r-cran-jsonlite
        continue-on-error: true

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Fetch news_found.json from job-hunter
        run: |
          mkdir -p ../job-hunter
          # news_found.json nunca se commitea a job-hunter (solo se deploya a Netlify).
          # Se baja del dashboard publico de Netlify, que se actualiza en cada run de job-hunter.
          if curl -sL --fail --max-time 15 \
            "https://job-hunter-dashboard.netlify.app/news_found.json" \
            -o ../job-hunter/news_found.json 2>/dev/null && \
             python -c "import json; d=json.load(open('../job-hunter/news_found.json')); assert isinstance(d, list)" 2>/dev/null; then
            echo "news_found.json OK ($(python -c "import json; print(len(json.load(open('../job-hunter/news_found.json'))))") articulos)"
          else
            echo "news_found.json invalido o no descargable. Continuando sin noticias."
            echo "[]" > ../job-hunter/news_found.json
          fi
        continue-on-error: true

      - name: Run research pipeline
        run: node scripts/research.mjs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # Verde tiene que significar paper O checkpoint: el pipeline corre en 3
      # dias (dia1 datos+stats, dia2 draft, dia3 revision+publicacion). Un run
      # que deja checkpoint es progreso legitimo; sin paper NI checkpoint es fallo.
      - name: Verify a paper or checkpoint was produced
        run: |
          today=$(date -u +%Y-%m-%d)
          if [ -f output/checkpoint.json ]; then
            echo "Pipeline multi-dia: checkpoint '$(python -c "import json;print(json.load(open('output/checkpoint.json'))['stage'])")' guardado. El paper se completa en el proximo run."
          elif ! ls output/papers/${today}_*.md >/dev/null 2>&1; then
            echo "::error::El run termino sin paper ni checkpoint. Verde sin producto es peor que rojo: revisa los logs del paso anterior."
            exit 1
          else
            echo "Paper del dia: $(ls output/papers/${today}_*.md)"
          fi

      - name: Copy papers to docs/ for GitHub Pages
        run: |
          mkdir -p docs/papers docs/charts
          # Limpiar papers obsoletos antes de copiar (evita slugs viejos colgados)
          rm -f docs/papers/*.md docs/papers/*.json
          for f in output/papers/*.md output/papers/*.json; do
            [ -f "$f" ] && cp "$f" "docs/papers/$(basename $f)"
          done
          # Charts por run: output/charts/<stamp>/figN.png -> docs/charts/<stamp>/
          rm -rf docs/charts/*
          cp -r output/charts/. docs/charts/ 2>/dev/null || true
          # Generate index.json listing all papers
          python scripts/generate-index.py

      - name: Build PDF papers with Typst
        run: python scripts/build_pdf.py

      - name: Export data catalog for web explorer
        run: python scripts/export_explorer_data.py

      - name: Export indicator catalog & codebook
        run: |
          node scripts/export-catalog.mjs
          python scripts/export_codebook.py

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/briefs/ output/papers/ output/raw/compute-results.json output/raw/fetched-data.json output/charts/ docs/papers/ docs/charts/ docs/data/ docs/index.json docs/knowledge.jsonl docs/memory.db
          # compute-r-results.json solo existe cuando R corre el panel (opcional).
          # Exigirlo en el git add abortaba todo el staging y el commit quedaba vacio.
          [ -f output/raw/compute-r-results.json ] && git add output/raw/compute-r-results.json || true
          # Checkpoint del pipeline multi-dia (existe en dias 1-2 del ciclo)
          [ -f output/checkpoint.json ] && git add output/checkpoint.json || true
          if [ -f output/checkpoint.json ]; then
            git commit -m "Research checkpoint ($(python -c "import json;print(json.load(open('output/checkpoint.json'))['stage'])")) - $(date -u +%Y-%m-%d)" || echo "::warning::No changes to commit (revisar git add)"
          else
            git commit -m "Daily research paper - $(date -u +%Y-%m-%d)" || echo "::warning::No changes to commit (revisar git add)"
          fi
          git push

      - name: Notify new paper via Resend
        # Requiere secrets RESEND_API_KEY/RESEND_FROM/RESEND_TO y variable EMAIL_ON_PUBLISH=true
        if: ${{ vars.EMAIL_ON_PUBLISH == 'true' }}
        continue-on-error: true
        run: |
          # En dias de checkpoint no hay paper nuevo — no notificar
          [ -f output/checkpoint.json ] && { echo "Dia de checkpoint, sin paper. Skip notify."; exit 0; }
          python scripts/notify-email.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_TO: ${{ secrets.RESEND_TO }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: research-${{ github.run_id }}
          path: |
            output/briefs/
            output/papers/
            output/charts/
            output/raw/compute-results.json
            docs/knowledge.jsonl
          retention-days: 30
